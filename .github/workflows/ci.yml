name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest -q
